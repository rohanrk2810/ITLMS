server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "native" reads plain files from disk instead of cloning a Git repository.
    # Right for local development and for a single-institute deployment where
    # config ships with the release. Switch to the "git" profile to get
    # versioned configuration with history and rollback.
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_LOCATIONS:file:./config-repo}
        # Do not fall back to a default profile's values when a requested
        # profile is missing: a service asking for "prod" config must fail
        # loudly rather than silently start on development defaults.
        fail-on-composite-error: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # The config server registers so services can find it by name, but it is
    # also reachable directly - services bootstrap from it before discovery.
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: git
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: ${CONFIG_GIT_BRANCH:main}
          search-paths: config-repo
          clone-on-start: true
          timeout: 10
