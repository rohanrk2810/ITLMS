# Serves the Vite build as a single-page app: every path that isn't a real
# file falls back to index.html so React Router (not Nginx) decides what a
# deep link like /app/placements/12 renders. The gateway is a separate origin
# (VITE_API_BASE_URL, baked in at build time) - this server holds only static
# assets, no API is proxied through it.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames (Vite's content-hash build output) never change contents
    # under the same name, so they can be cached for as long as a browser likes.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html names the hashed bundle for this deploy, so it must always be
    # revalidated - caching it would pin visitors to a stale build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
