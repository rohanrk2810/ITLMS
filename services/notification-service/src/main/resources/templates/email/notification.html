<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Notification</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:20px 28px;border-bottom:1px solid #e5e7eb;font-size:14px;color:#6b7280;"
            th:text="${institute}">IT Institute</td>
    </tr>
    <tr>
        <td style="padding:28px;">
            <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;" th:text="${title}">Title</h1>
            <p style="margin:0 0 20px;font-size:15px;line-height:1.6;white-space:pre-line;"
               th:if="${message}" th:text="${message}">Message</p>

            <div th:if="${temporaryPassword}"
                 style="margin:0 0 20px;padding:14px 16px;background:#f3f4f6;border-radius:6px;font-size:15px;">
                Temporary password:
                <strong style="font-family:Consolas,monospace;font-size:17px;letter-spacing:1px;"
                        th:text="${temporaryPassword}">xxxx</strong>
            </div>

            <p th:if="${link}" style="margin:0;">
                <a th:href="${link}" th:text="${linkLabel}"
                   style="display:inline-block;padding:11px 20px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:15px;">Open</a>
            </p>
        </td>
    </tr>
    <tr>
        <td style="padding:16px 28px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af;">
            You received this because you have an account with <span th:text="${institute}">IT Institute</span>.
            If you did not expect it, you can ignore it.
        </td>
    </tr>
</table>
</body>
</html>
