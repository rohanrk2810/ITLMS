# ---------------------------------------------------------------------
# admission-service - Leads, follow-ups, student and trainer profiles
# Owns database: itilms_admission (no other service connects to it)
# ---------------------------------------------------------------------
server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/itilms_admission
    username: ${DB_USERNAME:itilms}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration

itilms:
  docs:
    description: Leads, follow-ups, student and trainer profiles
