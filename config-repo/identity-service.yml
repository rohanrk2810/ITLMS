# ---------------------------------------------------------------------
# identity-service - Authentication, JWT issuing and user accounts
# Owns database: itilms_identity (no other service connects to it)
# ---------------------------------------------------------------------
server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/itilms_identity
    username: ${DB_USERNAME:itilms}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
  # The same Redis the gateway uses for rate limiting. Identity only writes one small key per change of duties.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s

management:
  health:
    # A Redis outage must not make sign-in unhealthy: the change of duties still saves, it just reaches the gateway late.
    redis:
      enabled: false

itilms:
  docs:
    description: Authentication, JWT issuing and user accounts

  # Seeded on first start so the institute can log in at all. The password
  # must be supplied through the environment; there is no built-in default,
  # because a well-known default admin password is how systems get owned.
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@itinstitute.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
    admin-first-name: Institute
    admin-last-name: Administrator
    enabled: ${BOOTSTRAP_ENABLED:true}

  # "Verify you are human" (Cloudflare Turnstile) on sign-in, registration and forgot-password. Off unless switched
  # on; when on, both keys are required and the service refuses to start without them.
  captcha:
    enabled: ${CAPTCHA_ENABLED:false}
    site-key: ${CAPTCHA_SITE_KEY:}
    secret: ${CAPTCHA_SECRET:}
    desktop-key: ${CAPTCHA_DESKTOP_KEY:}

  # "Continue with Google": set the OAuth client id (Web application) to switch it on.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  # Sign-in with a code sent on WhatsApp (Meta WhatsApp Cloud API, an approved authentication template).
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:}
    language-code: ${WHATSAPP_LANGUAGE:en}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
    dev-log-codes: ${WHATSAPP_DEV_LOG_CODES:false}

  security:
    # Off unless the institute takes admissions online. When off, accounts are
    # created by staff as part of the admission workflow (Doc S7.1).
    self-registration-enabled: ${SELF_REGISTRATION_ENABLED:false}
    # Repeated failures lock the account briefly. This blunts credential
    # stuffing without giving an attacker a way to lock out a real user
    # permanently - the window is short and self-clearing.
    max-failed-attempts: 5
    lockout-duration: 15m
    password:
      min-length: 8
      require-digit: true
      require-upper: true
      require-lower: true
      require-symbol: false
