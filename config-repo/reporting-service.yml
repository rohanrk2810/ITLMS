# ---------------------------------------------------------------------
# reporting-service - Dashboards, exports and the cross-service audit trail
# Owns database: itilms_reporting (no other service connects to it)
# ---------------------------------------------------------------------
server:
  port: 8092

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/itilms_reporting
    username: ${DB_USERNAME:itilms}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration

itilms:
  docs:
    description: Dashboards, exports and the cross-service audit trail

  reporting:
    # A CSV of every attendance row since the institute opened is a denial
    # of service dressed as a feature request. Exports are capped, and the
    # UI tells the user to narrow the filter rather than silently truncating.
    max-export-rows: ${MAX_EXPORT_ROWS:50000}
    audit-retention-days: ${AUDIT_RETENTION_DAYS:1095}
    dashboard-cache-seconds: 60
