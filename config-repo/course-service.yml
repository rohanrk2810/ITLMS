# ---------------------------------------------------------------------
# course-service - Course catalog, modules, lessons and lesson progress
# Owns database: itilms_course (no other service connects to it)
# ---------------------------------------------------------------------
server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/itilms_course
    username: ${DB_USERNAME:itilms}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration

itilms:
  docs:
    description: Course catalog, modules, lessons and lesson progress
