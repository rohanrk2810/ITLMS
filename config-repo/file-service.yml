# ---------------------------------------------------------------------
# file-service - Upload, metadata and authorised download
# Owns database: itilms_file (no other service connects to it)
# ---------------------------------------------------------------------
server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/itilms_file
    username: ${DB_USERNAME:itilms}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration

itilms:
  docs:
    description: Upload, metadata and authorised download

  storage:
    # "local" writes to a mounted volume - fine for development and a
    # single-server install. "minio" is the production choice (Doc S17):
    # object storage survives a container being replaced, and scales past
    # one machine's disk.
    backend: ${STORAGE_BACKEND:local}
    local-path: ${FILE_STORAGE_PATH:./storage}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:itilms}
    # Allow-list, not a block-list. A block-list of "dangerous" extensions
    # is always incomplete; naming what is acceptable is not.
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - image/webp
      - video/mp4
      - application/zip
      - text/plain
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
    max-size-by-category:
      AVATAR: 2MB
      DOCUMENT: 10MB
      ASSIGNMENT: 25MB
      SUBMISSION: 25MB
      LESSON_RESOURCE: 200MB
      CERTIFICATE: 5MB
      RECEIPT: 5MB
