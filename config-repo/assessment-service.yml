# ---------------------------------------------------------------------
# assessment-service - Assignments, submissions, MCQ tests and results
# Owns database: itilms_assessment (no other service connects to it)
# ---------------------------------------------------------------------
server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/itilms_assessment
    username: ${DB_USERNAME:itilms}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration

itilms:
  docs:
    description: Assignments, submissions, MCQ tests and results
